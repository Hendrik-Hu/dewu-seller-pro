<body><main>
  <h1>支持与安全反馈</h1>
  <p>卖家库存助手仅在 Android App 中提供库存管理功能。网页不提供登录和业务操作。</p>
  <div class="notice warning"><strong>公开反馈前请先脱敏。</strong>不要提交邮箱、密码、Token、订单号、货号、仓库名、库存或财务明细，也不要上传未经打码的截图。</div>
  <h2>普通使用问题</h2>
  <p>请先在 App“我的 → 支持与诊断”中预览最小诊断内容，再前往 <a href="https://github.com/Hendrik-Hu/dewu-seller-pro/issues">GitHub Issues</a>。公开 Issue 只填写版本号、匿名诊断 ID 和不含业务数据的现象描述。</p>
  <h2>安全问题</h2>
  <p>疑似安全漏洞请按仓库 <a href="https://github.com/Hendrik-Hu/dewu-seller-pro/security/policy">安全说明</a>选择私密渠道，不要在公开 Issue 披露利用细节或个人数据。</p>
  <p><a href="/">返回 Android App 使用说明</a> · <a href="/privacy.html">隐私说明</a> · <a href="/account-deletion.html">账号删除说明</a></p>
</main></body></html>
